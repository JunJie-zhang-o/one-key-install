[project]
name = "one-key-install"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "jay", email = "jay.zhangjunjie@outlook.com" }]
dependencies = [
    "rich",
    "fire>=0.7.0",
    "art>=6.5",
    "textual>=0.73.0",
    "python-i18n>=0.3.9",
]
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true


[project.scripts]
OneKeyInstall = "onekeyinstall.cli:main"
[dependency-groups]
dev = [
    "textual-dev>=1.6.1",
    "pyinstaller>=4.5.1",
]
